  <script data-sn-contact-events>
  (function () {
    var ALLOWED = { email_click: 1, contact_download: 1 };
    function send(name) {
      try {
        if (typeof gtag !== "function") return;
        gtag("event", name, { surface: "contact" });
      } catch (e) {}
    }
    document.addEventListener(
      "click",
      function (ev) {
        var t = ev.target;
        if (!t || !t.closest) return;
        var a = t.closest("a[data-sn-event]");
        if (!a) return;
        var name = a.getAttribute("data-sn-event");
        if (!name || !ALLOWED[name]) return;
        send(name);
      },
      false
    );
  })();
  </script>
