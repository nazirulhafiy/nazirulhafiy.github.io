<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>@@SITE_TITLE_ESC@@</title>
  <meta name="description" content="@@SITE_TAGLINE_ESC@@">
  <meta name="author" content="@@SITE_TITLE@@">
  <meta name="theme-color" content="#ffffff">
<link rel="canonical" href="https://hafiy.my/contact/">
  <link rel="icon" href="/assets/favicon.ico?v=3" sizes="16x16 32x32 48x48">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png?v=3">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon.png?v=3">
  <link rel="icon" type="image/png" sizes="48x48" href="/assets/favicon-48.png?v=3">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png?v=3">
  <link rel="stylesheet" href="/styles.css?v=46">
  <meta property="og:type" content="website">
  <meta property="og:title" content="@@SITE_TITLE_ESC@@">
  <meta property="og:description" content="@@SITE_TAGLINE_ESC@@">
  <meta property="og:url" content="https://hafiy.my/contact/">
  <meta property="og:site_name" content="@@SITE_TITLE_ESC@@">
  <meta property="og:image" content="@@SITE_SOCIAL_IMAGE@@">
  <meta property="og:image:type" content="@@SITE_SOCIAL_IMAGE_TYPE@@">
  <meta property="og:image:width" content="@@SITE_SOCIAL_IMAGE_WIDTH@@">
  <meta property="og:image:height" content="@@SITE_SOCIAL_IMAGE_HEIGHT@@">
  <meta property="og:image:alt" content="@@SITE_SOCIAL_IMAGE_ALT_ESC@@">
  <meta name="twitter:card" content="@@SITE_TWITTER_CARD@@">
  <meta name="twitter:title" content="@@SITE_TITLE_ESC@@">
  <meta name="twitter:description" content="@@SITE_TAGLINE_ESC@@">
  <meta name="twitter:image" content="@@SITE_SOCIAL_IMAGE@@">
  <meta name="twitter:image:alt" content="@@SITE_SOCIAL_IMAGE_ALT_ESC@@">
  @@ANALYTICS_LOADER@@
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>

  <main id="content">
    <article class="contact-page">
      <header class="contact-intro" data-box>
        <figure class="contact-avatar portrait-slot">
          <img class="contact-avatar-live" src="/assets/profile.png?v=2" alt="Portrait of @@SITE_TITLE@@" width="1024" height="1024">
          <img class="contact-avatar-helmet" src="/assets/contact-helmet-pfp.png?v=1" alt="" width="1024" height="1024" aria-hidden="true">
        </figure>
        <h1>@@SITE_TITLE@@</h1>
        <p class="contact-bio" data-one-line>@@SITE_TAGLINE_ESC@@</p>
      </header>

      <section class="contact-section" aria-labelledby="contact-title" data-box>
        <h2 id="contact-title">Contact</h2>
        <nav class="contact-actions" aria-label="Contact actions">
          <a class="contact-bar" href="https://wa.me/nazirulhafiy" target="_blank" rel="noreferrer">
            <span class="contact-bar-thumb" aria-hidden="true">
              <img src="/assets/contact/whatsapp.png?v=3" alt="" width="128" height="128">
            </span>
            <span class="contact-bar-title">WhatsApp</span>
            <span class="contact-bar-spacer" aria-hidden="true"></span>
          </a>
          <a class="contact-bar" href="tel:+60135623005">
            <span class="contact-bar-thumb" aria-hidden="true">
              <img src="/assets/contact/phone.png?v=7" alt="" width="128" height="128">
            </span>
            <span class="contact-bar-title">Call</span>
            <span class="contact-bar-spacer" aria-hidden="true"></span>
          </a>
          <a class="contact-bar" href="mailto:nazirul@hafiy.my" data-sn-event="email_click">
            <span class="contact-bar-thumb" aria-hidden="true">
              <img src="/assets/contact/email.png?v=3" alt="" width="128" height="128">
            </span>
            <span class="contact-bar-title">Email</span>
            <span class="contact-bar-spacer" aria-hidden="true"></span>
          </a>
          <a class="contact-bar" href="https://www.linkedin.com/in/nazirulhafiy/" target="_blank" rel="noreferrer">
            <span class="contact-bar-thumb" aria-hidden="true">
              <img src="/assets/contact/linkedin.png?v=3" alt="" width="128" height="128">
            </span>
            <span class="contact-bar-title">LinkedIn</span>
            <span class="contact-bar-spacer" aria-hidden="true"></span>
          </a>
        </nav>
      </section>

      <section class="contact-projects" aria-labelledby="projects-title" data-box>
        <h2 id="projects-title">Projects</h2>
        <nav class="contact-project-list" aria-label="Projects">
          <a class="contact-bar" href="https://pcds2030.com" target="_blank" rel="noreferrer">
            <span class="contact-bar-thumb" aria-hidden="true">
              <img src="/assets/contact/pcds2030.png?v=3" alt="" width="128" height="128">
            </span>
            <span class="contact-bar-title">pcds2030.com</span>
            <span class="contact-bar-spacer" aria-hidden="true"></span>
          </a>
          <a class="contact-bar" href="https://sde2030.com" target="_blank" rel="noreferrer">
            <span class="contact-bar-thumb" aria-hidden="true">
              <img src="/assets/contact/sde2030.png?v=3" alt="" width="128" height="128">
            </span>
            <span class="contact-bar-title">sde2030.com</span>
            <span class="contact-bar-spacer" aria-hidden="true"></span>
          </a>
          <a class="contact-bar" href="https://ai.sarawak.news" target="_blank" rel="noreferrer">
            <span class="contact-bar-thumb" aria-hidden="true">
              <img src="/assets/contact/ai-sarawak-news.png?v=3" alt="" width="128" height="128">
            </span>
            <span class="contact-bar-title">ai.sarawak.news</span>
            <span class="contact-bar-spacer" aria-hidden="true"></span>
          </a>
        </nav>
      </section>
    </article>
  </main>

  <footer class="site-footer contact-footer">
    <hr>
    <div><span>@@SITE_COPYRIGHT@@</span></div>
  </footer>
  <script data-sn-contact-events>
  (function () {
    var ALLOWED = { email_click: 1 };
    function send(name) {
      try {
        if (typeof gtag !== "function") return;
        gtag("event", name, { surface: "contact" });
      } catch (e) {}
    }
    document.addEventListener(
      "click",
      function (ev) {
        var t = ev.target;
        if (!t || !t.closest) return;
        var a = t.closest("a[data-sn-event]");
        if (!a) return;
        var name = a.getAttribute("data-sn-event");
        if (!name || !ALLOWED[name]) return;
        send(name);
      },
      false
    );
  })();
  </script>
</body>
</html>
