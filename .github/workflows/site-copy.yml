name: site copy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  site-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify built pages match templates
        run: |
          python3 scripts/build.py
          git diff --exit-code index.html experience.html posts/

      - name: Site copy source-of-truth test
        run: python3 -m unittest tests.test_site_copy -v

      - name: Check analytics dist against registry
        run: python3 scripts/check_analytics_dist.py

      - name: Analytics registry tests
        run: python3 -m unittest tests.test_analytics_registry -v
