# Watched paths (design/behaviour only; keep in sync with scripts/docs_check_pr.py and docs/ci-docs-check.md):
# - *.css (any directory)
# - *.js (any directory)
# Not watched: HTML pages, posts, images, sitemap.xml, robots.txt, CNAME, docs/.
# Also watched: site/templates/, scripts/build.py, analytics registry, data/site.json, data/analytics.json (see docs/ci-docs-check.md).
name: docs check

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch pull request commits
        run: |
          git fetch --no-tags origin \
            ${{ github.event.pull_request.base.sha }} \
            ${{ github.event.pull_request.head.sha }}

      - name: Ensure no-docs-needed label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "no-docs-needed" \
            --description "Design or behaviour change needs no docs/ update" \
            --color "0E8A16" 2>/dev/null || true

      - name: docs-check
        env:
          DOCS_CHECK_BASE: ${{ github.event.pull_request.base.sha }}
          DOCS_CHECK_HEAD: ${{ github.event.pull_request.head.sha }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: python3 scripts/docs_check_pr.py
